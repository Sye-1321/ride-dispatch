name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/RideDispatch.UnitTests/RideDispatch.UnitTests.csproj -c Release --no-build

      - name: Run integration tests
        run: dotnet test tests/RideDispatch.IntegrationTests/RideDispatch.IntegrationTests.csproj -c Release --no-build
